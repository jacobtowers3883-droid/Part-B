<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <title>Tic Tac Toe</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
  <body>
    <!-- In this lab you will be solving the puzzle of why a website that plays the children’s game “Tic Tac Toe” is broken. Quality Assurance and Testing is one of the most approachable career paths in Computer Science. Figuring out why things go wrong on a website (debugging) is a common entry-level task. -->
    <div style="margin:auto;width: 75%">
      
    <br><br><br>
    <div class="boxContainer">
      <span class="box" id="1" style="border-bottom: 3px solid black; border-right: 3px solid black;"></span>
      <span class="box" id="2" style="border-bottom: 3px solid black; border-right: 3px solid black; border-left: 3px solid black;"></span>
      <span class="box" id="3" style="border-bottom: 3px solid black; border-left: 3px solid black;"></span>
    </div>
    <div class="boxContainer">
      <span class="box" id="4" style="border-bottom: 3px solid black; border-right: 3px solid black; border-top: 3px solid black;"></span>
      <span class="box" id="5" style="border: 3px solid black;"></span>
      <span class="box" id="6" style="border-bottom: 3px solid black; border-left: 3px solid black; border-top: 3px solid black;"></span>
    </div>
    <div class="boxContainer">
      <span class="box" id="7" style="border-top: 3px solid black; border-right: 3px solid black;"></span>
      <span class="box" id="8" style="border-top: 3px solid black; border-right: 3px solid black; border-left: 3px solid black;"></span>
      <span class="box" id="9" style="border-top: 3px solid black; border-left: 3px solid black;"></span>
    </div>
    <div id="endGame">
      <div id="endGameContent">
        <div id="endGameText"></div>
       <div class="newGame" id="endBoxNewGame">
      New Game
    </div>
    </div>
      </div>
    <div id="baseDiv">
      <span class="scores">
      Losses:<span class="scoreNumbers" id="losses">0</span>
    </span>
    <span class="newGame" id="bottomNewGame">
      New Game
    </span>
    <span class="scores">
      Ties:<span class="scoreNumbers" id="ties">0</span>
    </span>
    </div>

  </div>
<script>
   var winningCombos = [
  ["1", "2", "3"],
  ["4", "5", "6"],
  ["7", "8", "9"],
  ["1", "5", "9"],
  ["3", "5", "7"],
  ["1", "4", "7"],
  ["2", "5", "8"],
  ["3", "6", "9"]
];
var xArray = [];
var oArray = [];
var ties =0;
var losses=0;

// This function runs whenever the player clicks on a box
$(".box").click(function() {
  if (this.innerHTML == "") {
    // Mark this box with the letter X
    this.innerHTML = "X;
    
    // Add this position to the list of places X controls
    xArray.push(this.id);

    // Check if anybody has won
    if (!Number.isInteger(checkWin(xArray, oArray.length + xArray.length, "X", true))) {
      
      //Take O's turn now that X has gone
      take_O_turn();
    }
  }
});

function take_O_turn()
{
      // Choose a place to put the 'O'
      var val = findOpenSquare();

      // Set that square's text to 'O'
      document.getElementById(val).innerHTML = "O";
      
      // Add that square to the list of squares 'O' controls
      oArray.push(val.toString());

      //Check if anybody has won yet
      checkWin(oArray, oArray.length + xArray.length, "O", true);
}

function findOpenSquare() {
  //Choose a random position to play an 'O'
  //Each box has its own number from 1 to 9
  return Math.floor(Math.random()*9 + 1);
}

//------------------------------------------------------------
//The code after this point is for checking who won and making
// the "New Game" button work.
// You don't need to change anything down here for Lab 4b!
function checkWin(array, tied, letter, real) {
  for (var i = 0; i < winningCombos.length; i++) {
    var win = false;
    for (var j = 0; j < winningCombos[i].length; j++) {
      if (array.includes(winningCombos[i][j])) {
        win = true;
      } else {
        win = false;
        break;
      }
      if (win == false) {
        continue;
      }
    }
    var result;
    if (win == true) {
      var result = 0;
      if (letter == "O") {
        result = 10;
      }
      if (letter == "X") {
        result = -10;
      }
      if (real == true) {
        $("#endGameText").html(letter + " won!");
        $("#endGame").show();
        losses++;
        $("#losses").html(losses);
      }
      return result;
    }
  }
  if (tie(tied)) {
    if (real == true) {
      $("#endGameText").html("Tie");
      $("#endGame").show();
      ties++;
      $("#ties").html(ties);
    }
    return 0;
  }
  return "merry";
}

$(".newGame").click(function() {
  $(".box").html("");
  xArray = [];
  oArray = [];
  $("#endGame").hide();
});
function tie(value) {
  if (value >= 9) {
    //console.log("tie");
    return true;
  } else {
    return false;
  }
}
</script>
<style>
  .box {
  background-color: white;
  height: 100px;
  width: 100px;
  margin: 2px;
  display: inline-block;
  font-size: 70px;
  font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
  position: relative;
  overflow: hidden;
  text-align: center;
  vertical-align: bottom;
}

.box:hover{
  background-color: #E1E1E1;
}

.boxContainer {
  position: relative;
  height: 100px;
  margin: 12px;
}

#endGame {
  display: none;
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 2;
  background-color: rgb(0,0,0,0.2);
  top:0;
  left:0;
}

#endGameContent {
  display: block;
  margin-left: auto;
  margin-right: auto;
  padding: 10px;
  width: 30%;
  background-color: white;
  opacity: 1;
  position: relative;
  top: 15%;
  font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif
}

.newGame{
  display: inline-block;
  padding: 8px;
  border: 2px solid black;
  width: 95px;
  text-align: center;
  font-weight: bold;
  font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif
}

.newGame:hover{
  background-color: #E1E1E1;
}

#endGameText{
  font-size: 20px;
  margin: 10px;
  text-align: center;
}

#endBoxNewGame{
  display: block;
  margin-left: auto;
  margin-right: auto;
}

.scores{
  display: inline-block;
  width: 95px;
  padding: 8px;
  border: 2px dashed black;
  text-align: left;
  font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif
}

.scoreNumbers{
  float: right;
  font-weight: bold;
  font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif
}

</style>
  </body>
</html>
